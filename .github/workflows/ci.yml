name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deskless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/bare/package-lock.json
      # Match .cursor/Dockerfile — evenhub-simulator (Flutter Linux) needs these.
      - name: Install Linux simulator deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            libnss3 \
            libxss1 \
            libasound2t64
      - name: Install (kit + bare example)
        run: |
          npm ci
          npm ci --prefix examples/bare
      - name: verify:deskless
        run: npm run verify:deskless
