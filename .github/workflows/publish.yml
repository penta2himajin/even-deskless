name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). Do not use long-lived NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Trusted Publishing needs a recent npm CLI (11.5.1+) and Node ≥ 22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/bare/package-lock.json
      - name: Ensure npm CLI supports OIDC publish
        run: npm install -g npm@latest
      - name: Install
        run: |
          npm ci
          npm ci --prefix examples/bare
      - name: verify:l0 (prepublish gate)
        run: npm run verify:l0
      - name: Publish (Trusted Publishing / OIDC)
        # Do not set NODE_AUTH_TOKEN — that forces the legacy token path.
        run: npm publish --access public --provenance
